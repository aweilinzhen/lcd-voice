<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI录音卡 LCD 状态原型</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <header class="page-header">
        <h1>AI录音卡 LCD 状态原型</h1>
        <p>开发状态模拟器</p>
    </header>


    <section class="workspace">

        <!-- =========================
             左侧：LCD设备预览
        ========================== -->
        <section class="left-panel">

            <div class="prototype-area">

                <div class="device">

                    <!-- 装饰高光 -->
                    <div class="device-highlight"></div>

                    <div class="lcd-bezel">

                        <div class="lcd">

                            <!-- 顶部状态栏 -->
                            <div id="statusBar" class="status-bar">

                                <div id="batteryStatus" class="battery-status">

                                    <div class="battery-shell">
                                        <div
                                            id="batteryFill"
                                            class="battery-fill">
                                        </div>
                                    </div>

                                    <span id="batteryText">
                                        85%
                                    </span>

                                </div>

                                <img
                                    id="bluetoothIcon"
                                    class="bluetooth-icon"
                                    src="./bluetooth.svg"
                                    alt="蓝牙">

                                <span
                                    id="extraIcon"
                                    class="extra-icon hidden">
                                    ?
                                </span>

                            </div>


                            <!-- 二维码 -->
                            <div
                                id="qrCode"
                                class="qr-code hidden">

                                <div class="qr-inner"></div>

                            </div>


                            <!-- 加载 -->
                            <div
                                id="loadingIcon"
                                class="loading-icon hidden">
                            </div>


                            <!-- 成功 -->
                            <div
                                id="successIcon"
                                class="success-icon hidden">
                                ✓
                            </div>


                            <!-- 失败 -->
                            <div
                                id="failIcon"
                                class="fail-icon hidden">
                                ×
                            </div>


                            <!-- 标记 -->
                            <div
                                id="markIcon"
                                class="mark-icon hidden">
                                ★
                            </div>


                            <!-- OTA升级 -->
                            <div
                                id="updateIcon"
                                class="update-icon hidden">
                                ↑
                            </div>


                            <!-- =========================
                                 录音波形
                                 横向主视觉
                            ========================== -->
                            <div
                                id="wave"
                                class="wave hidden">

                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>

                            </div>


                            <!-- LCD主文字 -->
                            <div
                                id="line1"
                                class="line-main">
                            </div>


                            <!-- LCD副文字 -->
                            <div
                                id="line2"
                                class="line-sub">
                            </div>


                            <!-- 进度区域 -->
                            <div
                                id="progressArea"
                                class="progress-area hidden">

                                <div
                                    id="progressText"
                                    class="progress-text">
                                </div>

                                <div class="progress-track">

                                    <div
                                        id="progressFill"
                                        class="progress-fill">
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- LED -->
                    <div class="led-area">

                        <div class="led-ring">

                            <div
                                id="led"
                                class="led">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             右侧控制区
        ========================== -->
        <section class="right-panel">

            <section class="controls">


                <!-- =========================
                     设备状态
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon device-icon">

                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="6"></circle>
                                <circle cx="12" cy="12" r="9"></circle>
                            </svg>

                        </div>

                        <h2>设备状态</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="firstBoot">
                            首次开机
                        </button>

                        <button data-state="deviceConnecting">
                            连接中
                        </button>

                        <button data-state="deviceConnected">
                            连接成功
                        </button>

                        <button data-state="deviceConnectFail">
                            连接失败
                        </button>

                        <button data-state="shutdown">
                            关机
                        </button>

                    </div>

                </div>


                <!-- =========================
                     录音状态
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon record-icon">

                            <svg viewBox="0 0 24 24">

                                <rect
                                    x="8"
                                    y="3"
                                    width="8"
                                    height="12"
                                    rx="4">
                                </rect>

                                <path d="M5 11v1a7 7 0 0 0 14 0v-1"></path>
                                <path d="M12 19v3"></path>
                                <path d="M9 22h6"></path>

                            </svg>

                        </div>

                        <h2>录音状态</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="idle">
                            待机
                        </button>

                        <button data-state="recordStart">
                            录音启动
                        </button>

                        <button data-state="recording">
                            录音中
                        </button>

                        <button data-state="recordPause">
                            暂停录音
                        </button>

                        <button data-state="recordEnd">
                            录音结束
                        </button>

                        <button data-state="mark">
                            标记
                        </button>

                        <button data-state="recordFail">
                            录音失败
                        </button>

                    </div>

                </div>


                <!-- =========================
                     电量显示
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon battery-icon">

                            <svg viewBox="0 0 24 24">
                                <path d="M13 2 6 13h6l-1 9 7-12h-6z"></path>
                            </svg>

                        </div>

                        <h2>电量显示</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="batteryLow">
                            低电量
                        </button>

                        <button data-state="batteryCritical">
                            极低电量
                        </button>

                        <button data-state="charging">
                            充电中
                        </button>

                        <button data-state="charged">
                            充满电
                        </button>

                    </div>

                </div>


                <!-- =========================
                     蓝牙连接
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon bluetooth-control-icon">

                            <svg viewBox="0 0 24 24">
                                <path d="M7 7l10 10-5 4V3l5 4L7 17"></path>
                            </svg>

                        </div>

                        <h2>蓝牙连接</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="btWaiting">
                            待连接
                        </button>

                        <button data-state="btConnecting">
                            连接中
                        </button>

                        <button data-state="btConnected">
                            已连接
                        </button>

                        <button data-state="btDisconnected">
                            断开连接
                        </button>

                    </div>

                </div>


                <!-- =========================
                     数据传输
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon transfer-icon">

                            <svg viewBox="0 0 24 24">
                                <path d="M8 3v16"></path>
                                <path d="m4 7 4-4 4 4"></path>
                                <path d="M16 21V5"></path>
                                <path d="m12 17 4 4 4-4"></path>
                            </svg>

                        </div>

                        <h2>数据传输状态</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="bleTransfer">
                            蓝牙传输中
                        </button>

                        <button data-state="wifiWaiting">
                            Wi-Fi待连接
                        </button>

                        <button data-state="wifiConnected">
                            Wi-Fi已连接
                        </button>

                        <button data-state="wifiTransfer">
                            Wi-Fi传输中
                        </button>

                    </div>

                </div>


                <!-- =========================
                     存储状态
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon storage-icon">

                            <svg viewBox="0 0 24 24">
                                <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
                                <path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>
                                <path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path>
                            </svg>

                        </div>

                        <h2>存储状态</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="storageLow">
                            存储不足
                        </button>

                        <button data-state="storageFull">
                            存储满
                        </button>

                    </div>

                </div>


                <!-- =========================
                     系统状态
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon system-icon">

                            <svg viewBox="0 0 24 24">
                                <path d="M12 3 2.8 20h18.4z"></path>
                                <path d="M12 9v5"></path>
                                <path d="M12 17.2v.2"></path>
                            </svg>

                        </div>

                        <h2>系统状态</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="systemError">
                            设备异常
                        </button>

                    </div>

                </div>


                <!-- =========================
                     OTA升级
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon ota-icon">

                            <svg viewBox="0 0 24 24">
                                <path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 8.5 4.5 4.5 0 0 0 7 18z"></path>
                                <path d="M12 17V9"></path>
                                <path d="m9 12 3-3 3 3"></path>
                            </svg>

                        </div>

                        <h2>OTA升级</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="updating">
                            升级中
                        </button>

                        <button data-state="updateFail">
                            升级失败
                        </button>

                    </div>

                </div>


                <!-- =========================
                     LED状态
                ========================== -->
                <div class="control-group">

                    <div class="control-title">

                        <div class="control-icon led-control-icon">

                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="5"></circle>
                                <path d="M12 2v2"></path>
                                <path d="M12 20v2"></path>
                                <path d="m4.9 4.9 1.4 1.4"></path>
                                <path d="m17.7 17.7 1.4 1.4"></path>
                                <path d="M2 12h2"></path>
                                <path d="M20 12h2"></path>
                                <path d="m4.9 19.1 1.4-1.4"></path>
                                <path d="m17.7 6.3 1.4-1.4"></path>
                            </svg>

                        </div>

                        <h2>LED状态</h2>

                    </div>


                    <div class="button-grid">

                        <button data-state="ledRecording">
                            录音红灯
                        </button>

                    </div>

                </div>


            </section>

        </section>

    </section>

</main>


<script src="app.js"></script>

</body>

</html>
